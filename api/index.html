<!DOCTYPE html>
<html lang="en">
<head>
    <title>API Reference | WalkLists</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="WalkLists API reference — walk lists, contacts, tasks, and data enrichment endpoints with interactive examples.">
    <link rel="canonical" href="https://help.walklists.com/api/">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.scalar.com" crossorigin>
    <link rel="preload" href="/api/openapi.yaml" as="fetch" crossorigin>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .api-loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e0e0e0;
            transition: opacity 0.3s ease;
        }
        .api-loading.fade-out { opacity: 0; pointer-events: none; }
        .api-loading-content { text-align: center; }
        .api-loading h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
        .api-loading p { font-size: 14px; color: #94a3b8; }
        .api-loading .spinner { width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #0086ad; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link {
            position: fixed;
            top: 12px;
            left: 16px;
            z-index: 10000;
            background: #1e293b;
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .back-link:hover { background: #334155; color: #fff; }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Help Center</a>
    <div class="api-loading" id="api-loading">
        <div class="api-loading-content">
            <div class="spinner"></div>
            <h1>WalkLists API Documentation</h1>
            <p>Loading interactive API reference...</p>
        </div>
    </div>
    <noscript>
        <style>.api-loading { display: none !important; }</style>
        <div style="max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: sans-serif;">
            <h1>WalkLists API Documentation</h1>
            <p>Field intelligence API for walk lists, contacts, tasks, and data enrichment.</p>
            <p>Enable JavaScript to view the full interactive API documentation.</p>
            <p><a href="https://walklists.com">Back to WalkLists</a></p>
        </div>
    </noscript>
    <script id="api-reference" data-url="/api/openapi.yaml"></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.44.18" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var l = document.getElementById('api-loading');
        if (!l) return;
        var o = new MutationObserver(function() {
            if (!document.querySelector('.scalar-app')) return;
            l.classList.add('fade-out');
            setTimeout(function() { l.remove(); }, 400);
            o.disconnect();
        });
        o.observe(document.body, { childList: true, subtree: true });
    });
    </script>
</body>
</html>
